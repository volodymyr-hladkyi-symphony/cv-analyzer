# Docker LLM profile using an OpenAI-compatible local endpoint
# Ensure only OpenAI-compatible auto-config is active in this profile
spring.ai.ollama.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
# Use host.docker.internal so containers can reach the host service
spring.ai.openai.base-url=http://host.docker.internal:12434/engines
spring.ai.openai.chat.base-url=http://host.docker.internal:12434/engines
spring.ai.openai.api-key=dummy
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.model=ai/gemma3

# Pricing Configuration (per 1M tokens) — mirrors Groq defaults
openai.pricing.input-tokens-per-million=${OPENAI_PRICING_INPUT:0.59}
openai.pricing.output-tokens-per-million=${OPENAI_PRICING_OUTPUT:0.79}
openai.pricing.currency=${OPENAI_PRICING_CURRENCY:USD}

# Increase server and async timeouts to accommodate slow local LLM
server.tomcat.connection-timeout=120000
spring.mvc.async.request-timeout=120000
spring.webflux.request.timeout=120s

