# Ollama profile (local daemon)

# Ensure only Ollama auto-config is active in this profile
spring.ai.ollama.enabled=true
spring.ai.openai.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

# Use host.docker.internal from containers; localhost if running backend locally
spring.ai.ollama.base-url=http://host.docker.internal:11434

# Default model; adjust to one you have pulled (e.g., llama3.1, mistral, qwen2.5)
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.chat.options.temperature=0.1

# Timeouts for slow local inference
server.tomcat.connection-timeout=180000
spring.mvc.async.request-timeout=180000

# Pricing placeholders (if you want cost tracking to still compute)
openai.pricing.input-tokens-per-million=${OPENAI_PRICING_INPUT:0.10}
openai.pricing.output-tokens-per-million=${OPENAI_PRICING_OUTPUT:0.40}
openai.pricing.currency=${OPENAI_PRICING_CURRENCY:USD}

