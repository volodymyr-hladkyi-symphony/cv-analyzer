# Ollama profile (local daemon)

# Ensure only Ollama auto-config is active in this profile
spring.ai.ollama.enabled=true
spring.ai.openai.enabled=false
# Exclude all OpenAI autoconfigurations to prevent API key requirement
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiVectorStoreAutoConfiguration
# Set dummy OpenAI API key as fallback for all OpenAI services (not used when Ollama is active)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.speech.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.transcription.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.moderation.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.embedding.api-key=${OPENAI_API_KEY:dummy}
spring.ai.openai.image.api-key=${OPENAI_API_KEY:dummy}

# Use host.docker.internal from containers; localhost if running backend locally
spring.ai.ollama.base-url=http://host.docker.internal:11434

# Default model; adjust to one you have pulled (e.g., llama3.1, mistral, qwen2.5)
spring.ai.ollama.chat.options.model=gemma3:4b
spring.ai.ollama.chat.options.temperature=0.1

# Timeouts for slow local inference
server.tomcat.connection-timeout=180000
spring.mvc.async.request-timeout=180000

# Pricing placeholders (if you want cost tracking to still compute)
openai.pricing.input-tokens-per-million=${OPENAI_PRICING_INPUT:0.0}
openai.pricing.output-tokens-per-million=${OPENAI_PRICING_OUTPUT:0.0}
openai.pricing.currency=${OPENAI_PRICING_CURRENCY:USD}