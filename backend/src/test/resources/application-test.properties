# Test configuration
spring.application.name=cv-analyzer-test
spring.ai.ollama.enabled=false
spring.ai.openai.api-key=test-api-key
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.1

# Disable security for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logging for tests
logging.level.org.springframework.ai=WARN
logging.level.com.symphony_solutions.cv_analyzer=DEBUG

# Admin credentials for tests
admin.username=test-admin
admin.password=test-password

# OpenAI Pricing Configuration for tests
openai.pricing.input-tokens-per-million=0.1
openai.pricing.output-tokens-per-million=0.4
openai.pricing.currency=USD

# Candidate Rating Configuration for tests
candidate.rating.min=1
candidate.rating.max=100

# Disable actuator endpoints for tests
management.endpoints.web.exposure.include=
