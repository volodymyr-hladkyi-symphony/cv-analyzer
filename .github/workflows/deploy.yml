name: Deploy to GKE

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  SERVICE: candidate-matcher
  REGION: ${{ secrets.GKE_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
        project_id: '${{ secrets.GCP_PROJECT_ID }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Install gke-gcloud-auth-plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin
        echo "✅ gke-gcloud-auth-plugin installed"

    - name: Configure Docker for GCR
      run: |
        gcloud auth configure-docker
        gcloud auth configure-docker gcr.io
        echo "✅ Docker authentication configured for GCR"

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
          --zone ${{ secrets.GKE_ZONE }} \
          --project $PROJECT_ID

    - name: Build and push Docker image
      run: |
        # Generate tag from git commit
        GIT_TAG=${GITHUB_SHA::7}
        IMAGE_NAME="gcr.io/$PROJECT_ID/candidate-matcher"
        
        # Build image with Groq profile
        echo "Building Docker image with Groq configuration..."
        docker build -t $IMAGE_NAME:$GIT_TAG \
          --build-arg SPRING_PROFILES_ACTIVE=groq \
          ./backend/
        
        docker build -t $IMAGE_NAME:latest \
          --build-arg SPRING_PROFILES_ACTIVE=groq \
          ./backend/
        
        # Push images
        echo "Pushing Docker images to GCR..."
        docker push $IMAGE_NAME:$GIT_TAG
        docker push $IMAGE_NAME:latest

    - name: Deploy to GKE
      run: |
        GIT_TAG=${GITHUB_SHA::7}
        IMAGE_NAME="gcr.io/$PROJECT_ID/candidate-matcher"
        
        # Update deployment with Groq configuration
        echo "Deploying to GKE with Groq profile..."
        kubectl set image deployment/cv-analyzer candidate-matcher=$IMAGE_NAME:$GIT_TAG
        
        # Set environment variables for Groq
        kubectl set env deployment/cv-analyzer \
          SPRING_PROFILES_ACTIVE=groq \
          OPENAI_API_KEY=${{ secrets.GROQ_API_KEY }} \
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }} \
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
        
        # Wait for rollout
        kubectl rollout status deployment/cv-analyzer --timeout=300s

    - name: Verify deployment
      run: |
        kubectl get pods -l app=cv-analyzer
        kubectl get services

    - name: Show logs
      if: always()
      run: |
        kubectl logs -l app=cv-analyzer --tail=20

    - name: Apply Backend Service manifest
      run: kubectl apply -f ./backend/k8s/cv-analyzer-service.yaml

    - name: Apply Frontend Deployment manifest
      run: kubectl apply -f ./frontend/k8s/cv-analyzer-frontend-deployment.yaml

    - name: Apply Frontend Service manifest
      run: kubectl apply -f ./frontend/k8s/cv-analyzer-frontend-service.yaml

    - name: Wait for Backend External IP
      id: wait_backend_ip
      run: |
        for i in {1..30}; do
          BACKEND_IP=$(kubectl get svc cv-analyzer-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$BACKEND_IP" ]; then
            echo "BACKEND_IP=$BACKEND_IP" >> $GITHUB_ENV
            echo "Backend IP: $BACKEND_IP"
            break
          fi
          echo "Waiting for backend IP... ($i/30)"
          sleep 10
        done
        if [ -z "$BACKEND_IP" ]; then
          echo "Backend IP not assigned after waiting."
          exit 1
        fi

    - name: Update nginx.conf with Backend IP
      run: |
        sed -i "s|http://backend:8080|http://$BACKEND_IP:8080|g" ./frontend/nginx.conf
        cat ./frontend/nginx.conf

    - name: Build and push Frontend Docker image
      run: |
        GIT_TAG=${GITHUB_SHA::7}
        FRONTEND_IMAGE="gcr.io/$PROJECT_ID/cv-analyzer-frontend"
        docker build -t $FRONTEND_IMAGE:$GIT_TAG ./frontend/
        docker push $FRONTEND_IMAGE:$GIT_TAG

    - name: Deploy Frontend to GKE
      run: |
        GIT_TAG=${GITHUB_SHA::7}
        FRONTEND_IMAGE="gcr.io/$PROJECT_ID/cv-analyzer-frontend"
        kubectl set image deployment/cv-analyzer-frontend frontend=$FRONTEND_IMAGE:$GIT_TAG
        kubectl rollout status deployment/cv-analyzer-frontend --timeout=300s

    - name: Get Frontend External IP
      run: |
        FRONTEND_IP=$(kubectl get svc cv-analyzer-frontend-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Frontend External IP: http://$FRONTEND_IP"
