name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test GCP Secrets
      run: |
        echo "Testing if secrets are available..."
        
        if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
          echo "❌ GCP_PROJECT_ID is not set"
          exit 1
        else
          echo "✅ GCP_PROJECT_ID is set: ${{ secrets.GCP_PROJECT_ID }}"
        fi
        
        if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
          echo "❌ GCP_SA_KEY is not set"
          exit 1
        else
          echo "✅ GCP_SA_KEY is set (length: ${#GCP_SA_KEY})"
        fi
        
        if [ -z "${{ secrets.GKE_CLUSTER_NAME }}" ]; then
          echo "❌ GKE_CLUSTER_NAME is not set"
          exit 1
        else
          echo "✅ GKE_CLUSTER_NAME is set: ${{ secrets.GKE_CLUSTER_NAME }}"
        fi
        
        if [ -z "${{ secrets.GKE_ZONE }}" ]; then
          echo "❌ GKE_ZONE is not set"
          exit 1
        else
          echo "✅ GKE_ZONE is set: ${{ secrets.GKE_ZONE }}"
        fi
        
        if [ -z "${{ secrets.GKE_REGION }}" ]; then
          echo "❌ GKE_REGION is not set"
          exit 1
        else
          echo "✅ GKE_REGION is set: ${{ secrets.GKE_REGION }}"
        fi
        
        echo "🎉 All secrets are properly configured!"
